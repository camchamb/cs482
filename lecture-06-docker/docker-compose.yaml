services:
  hello:
    build: ./hello_svc
    expose:
      - "8000"
    environment:
      - APP_URL=${SERVICE_FQDN_HELLO}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
